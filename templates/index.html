
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Video Generator MVP</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="wrap">
    <h1>AI Video Generator (MVP)</h1>
    <p class="sub">Upload photo + video, click Generate, watch progress, get output.</p>

    <div class="card">
      <label class="lbl">1) Upload Photo</label>
      <input id="photo" type="file" accept="image/*" />

      <label class="lbl">2) Upload Video</label>
      <input id="video" type="file" accept="video/*" />

      <button id="generate">Generate Video</button>

      <div id="statusBox" class="status hidden">
        <div class="row">
  	<div>
    	Status: <span id="status">-</span><br/>
    	   <small class="muted">Stage: <span id="stage">-</span></small>
        </div>
  <div><span id="percent">0</span>%</div>
	</div>

        <div class="bar">
          <div id="barFill" class="fill"></div>
        </div>
        <div class="hint" id="hint">Processing…</div>
      </div>
    </div>

    <div class="card">
      <h2>Output</h2>
      <video id="outVideo" controls class="video hidden"></video>
      <a id="downloadLink" class="download hidden" href="#" download>Download Output</a>
      <audio id="outAudio" controls class="video hidden"></audio>

      <a id="audioLink" class="download hidden" href="#" download>
Download Extracted Audio
</a>

    </div>

    <div class="footer">
      <small>Day-1 demo uses placeholder output. Day-3: real generation engine integration.</small>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
